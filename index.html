function go(v){view=v;render();window.scrollTo(0,0)}
function home(){return `<section class="hero"><div><div class="eyebrow">FRIDAY DINNER CLUB</div><h1>“아무거나” 말고,<br>다 같이 괜찮은 걸로<span style="color:var(--orange)">.</span></h1><p>먹고 싶은 게 없어도 괜찮아.<br>싫은 건 빼고, 친구들의 취향을 모아 오늘 저녁을 정해요.</p><button class="primary big" data-action="create">친구들과 메뉴 정하기 ↗</button><p class="hint">가입 없이 닉네임만으로 · 같은 기기에서 함께</p></div><div class="hero-art"><span class="pill">오늘의 고민은 여기까지</span><div class="foodrow">🍙 🍗 🍕</div><div class="note"><span class="eyebrow">OUR DINNER, OUR CHOICE</span><h3>민수는 치킨, 지수는 김밥 🍙</h3><p class="muted">서로의 취향은 달라도<br>함께 먹을 메뉴는 찾을 수 있어요.</p><div class="flex"><span class="pill">싫어요는 존중하고</span><span class="pill orange">결정은 함께</span></div></div></div></section><div class="steps"><div class="box"><b>01 · GATHER</b><h3>우리끼리 모이기</h3><p class="muted">방을 만들고 이 기기에서 참여자를 추가해요.</p></div><div class="box"><b>02 · CHOOSE</b><h3>취향은 가볍게</h3><p class="muted">간단한 질문에 답하고 싫은 메뉴는 빼요.</p></div><div class="box"><b>03 · AGREE</b><h3>마지막은 다 같이</h3><p class="muted">최종 메뉴를 확인하고 함께 동의해요.</p></div></div>`}
function create(){return `<div class="form"><button class="back" data-action="home">← 처음으로</button><div class="eyebrow">START A TABLE</div><h1>오늘 저녁, 같이 정하자.</h1><p class="muted">친구들을 초대할 우리만의 방을 만들어요.</p><form id="createform" class="box"><label class="field">방 이름</label><input name="name" required minlength="2" maxlength="30" value="금요일 석식 원정대"><label class="field">내 닉네임</label><input name="nickname" required minlength="2" maxlength="12" placeholder="친구들이 알아볼 수 있는 이름"><label class="field">의견을 모을 시간</label><select name="minutes"><option value="10">10분</option><option value="15" selected>15분</option><option value="30">30분</option><option value="60">1시간</option></select><p class="hint">의견 마감 후 10분 동안 최종 합의를 진행해요.<br>방 데이터는 생성 후 7일 동안 보관돼요.</p><button class="primary full big" type="submit">우리 방 만들기 →</button></form></div>`}
function join(){return `<div class="form"><div class="eyebrow">YOU'RE INVITED</div><h1>${esc(room.name)}</h1><p class="muted">${room.count}명이 모여 있어요</p><form id="joinform" class="box"><h2>오늘은 같이 먹자 👋</h2><label class="field">닉네임</label><input name="nickname" minlength="2" maxlength="12" required placeholder="친구들이 부르는 이름"><p class="hint">닉네임과 직접 제안은 방 친구들에게 보여요.<br>입장만으로 동의한 것으로 처리하지 않아요.</p><button class="primary full" ${room.status!=='collecting'?'disabled':''}>${room.status==='collecting'?'함께 메뉴 고르기':'의견 수집이 끝났어요'}</button></form></div>`}
function sidebar(){return `<aside><div class="box"><div class="flex"><h3>우리 방 현황</h3><span class="pill">${submitted().length}/${active().length}</span></div><div class="progress"><div style="width:${100*submitted().length/active().length}%"></div></div><p class="hint">${submitted().length}명 제출 · ${active().length-submitted().length}명 기다리는 중</p><button class="primary full" data-action="preferences">${room.response?'내 의견 바꾸기':'내 취향 알려주기 →'}</button><div class="people">${active().map(p=>`<div class="person"><div class="avatar">${esc(p.name.slice(0,1))}</div><span>${esc(p.name)} ${p.id===room.host?'♔':''}</span><small class="${p.submitted?'':'muted'}">${p.submitted?'✓ 제출 완료':'작성 중'}</small></div>`).join('')}</div></div><div class="box soft"><span class="eyebrow">A LITTLE REMINDER</span><h3>다수결보다, 모두의 괜찮아.</h3><p class="hint">한 명이 싫다고 한 메뉴도 추천에서 빼요. 먹기 편한 메뉴부터 함께 살펴봐요.</p></div>${host()?`<div class="box"><h3>방장 메뉴</h3><p class="hint">미제출자는 이번 합의에 포함되지 않아요.</p><button class="dark full" data-action="review">의견 수집 마감하기</button></div>`:''}</aside>`}
function dashboard(){let groups=catalog.map(m=>({...m,people:active().filter(p=>wishlist(p).includes(m.id))})).filter(m=>m.people.length).sort((a,b)=>b.people.length-a.people.length);let allowed=filteredMenus(room.recommendations);return `<div class="flex"><div><div class="eyebrow">OUR FRIDAY TABLE</div><h1>${esc(room.name)}</h1><div class="muted">취향을 모아 함께 정하는 오늘의 메뉴</div></div><button data-action="share">참여자 추가 ＋</button></div><div class="banner"><span>◷ 의견 마감 <b>${time(room.collectAt)}</b> · 제출한 친구들의 조건만 반영해요</span><span class="pill">의견 모으는 중</span></div><div class="grid"><section><div class="sectionhead"><h2>친구들은 이게 먹고 싶대요 <span style="color:var(--orange)">✦</span></h2><small>직접 제안한 메뉴</small></div><div class="box">${groups.length?groups.map(m=>`<div class="suggestion"><div class="emoji">${m.emoji}</div><div class="body"><b>${esc(m.name)}</b><p>${esc(m.people.map(p=>p.name).join(', '))}의 선택 ${!room.recommendations.some(a=>a.id===m.id)?' · 현재 제외된 메뉴':''}</p></div><button data-action="suggest" data-id="${m.id}">나도! ${m.people.length} ♡</button></div>`).join(''):'<div class="empty">아직 제안이 없어요.<br>내 취향 입력에서 먹고 싶은 메뉴를 알려주세요.</div>'}</div><div class="sectionhead"><h2>우리에게 괜찮은 메뉴</h2><small>먹기 편한 순 · ${submitted().length}명 기준</small></div>${pickerControls()}<p class="hint">조건에 맞는 ${allowed.length}종 · 전체 카탈로그 ${catalog.length}종</p><div class="cards">${allowed.slice(0,pickerLimit).map(m=>`<article class="box food"><div class="foodpic"><span class="pill">${m.convenience>=75?'✦ 먹기 편해요':m.convenience>=50?'✓ 정리가 조금 필요해요':'국물·쓰레기 정리가 필요해요'}</span>${m.emoji}</div><div class="foodbody"><div class="flex"><h3>${esc(m.name)}</h3><span class="muted" style="font-size:12px">${m.match}명 선호</span></div><p>${esc(m.cuisine)} · ${esc(m.keywords.slice(2,5).join(' · '))}</p><div class="flex"><button class="dark" data-action="suggest" data-id="${m.id}">먹고 싶어요 ♡</button><button data-action="exclude" data-id="${m.id}" ${wishlist(active().find(p=>p.id===room.me)).includes(m.id)?'disabled':''}>오늘은 싫어요</button></div></div></article>`).join('')}</div>${allowed.length>pickerLimit?'<button data-action="moreMenus">추천 메뉴 더 보기 ＋</button>':''}${!allowed.length?`<div class="box empty"><div class="symbol">${submitted().length?'🤔':'🍽️'}</div><h3>${submitted().length?'조건에 맞는 메뉴가 없어요':'첫 번째 의견을 기다려요'}</h3><p>${submitted().length?'각자 제외 조건을 조금씩 다시 살펴봐 주세요.<br>싫어요를 자동으로 해제하지 않아요.':'내 취향을 알려주면 함께 먹을 후보가 나타나요.'}</p><button data-action="preferences">내 의견 입력하기</button></div>`:''}</section>${sidebar()}</div>`}
function choices(key,items){return `<div class="choices">${items.map(([v,label])=>`<button type="button" class="${draft[key]===v?'on':''}" data-action="choice" data-key="${key}" data-value="${v}">${label}</button>`).join('')}</div>`}

const cuisineList=()=>[...new Set(catalog.map(m=>m.cuisine))];
const filterGroups=[
 {key:'cuisine',name:'음식 분류',options:()=>cuisineList()},
 {key:'staple',name:'주식 종류',options:()=>['밥','면','빵','요리']},
 {key:'ingredient',name:'주요 재료',options:()=>['소고기','돼지고기','닭고기','해산물','생선','새우','채소','두부','치즈']},
 {key:'cooking',name:'조리 방식',options:()=>['구이','튀김','찜','볶음','비빔','국물','비국물']},
 {key:'flavor',name:'맛',options:()=>['매운맛','순한맛']},
 {key:'type',name:'메뉴 종류',options:()=>['덮밥','볶음밥','국밥','찌개','파스타','쌀국수','카레','피자','버거','샌드위치','샐러드','포케','만두']},
 {key:'style',name:'먹는 방식',options:()=>['함께먹기','간편식']}
];
function resetPicker(){pickerFilters={};pickerQuery='';pickerLimit=24;}
function filteredMenus(list){let q=pickerQuery.toLowerCase().replace(/\s/g,'');return list.filter(m=>filterGroups.every(g=>!pickerFilters[g.key]||(g.key==='cuisine'?m.cuisine===pickerFilters[g.key]:g.key==='staple'?({rice:'밥',noodle:'면',bread:'빵',other:'요리'}[m.staple]===pickerFilters[g.key]):m.keywords.includes(pickerFilters[g.key])))&&(!q||[m.name,...m.keywords,...m.aliases].some(s=>s.toLowerCase().replace(/\s/g,'').includes(q))));}
function pickerControls(){return `<div class="menu-browser"><label class="field" for="menu-search">메뉴 이름이나 키워드 검색</label><input id="menu-search" data-menu-search placeholder="예: 족발, 쌀국수, 파스타" value="${esc(pickerQuery)}"><details class="filter-panel" open><summary>분류별로 메뉴 찾기 <small>${Object.values(pickerFilters).filter(Boolean).length}개 조건</small></summary>${filterGroups.map(g=>`<div class="filter-row"><b>${g.name}</b><div class="choices">${['전체',...g.options()].map(v=>`<button type="button" class="${(pickerFilters[g.key]||'전체')===v?'on':''}" data-action="filterOption" data-key="${g.key}" data-value="${v}">${v}</button>`).join('')}</div></div>`).join('')}<button type="button" data-action="clearFilters">조건 모두 초기화</button><p class="hint">각 분류에서 하나씩 골라 조합할 수 있어요. 예: 중식 + 면 + 국물<br>이 조건은 목록을 찾는 필터예요. 먹고 싶거나 피할 메뉴는 아래에서 따로 선택해 주세요.</p></details></div>`;}

function pickerItems(mode){let list=filteredMenus(catalog),chosen=mode==='excludeDraft'?draft.excluded:mode==='draftSuggest'?wishlist(draft):[];return `<p class="hint">전체 ${catalog.length}종 중 ${list.length}종 · ${chosen.filter(Boolean).length}개 선택</p><div class="choices menu-options">${list.slice(0,pickerLimit).map(m=>`<button type="button" class="${chosen.includes(m.id)?'on':''}" data-action="${mode}" data-id="${m.id}" ${mode==='excludeDraft'&&wishlist(draft).includes(m.id)?'disabled aria-disabled="true"':''} title="${esc(m.keywords.join(' · '))}">${chosen.includes(m.id)?'✓ ':''}${m.emoji} ${esc(m.name)}<small>${mode==='excludeDraft'&&wishlist(draft).includes(m.id)?'먹고 싶은 메뉴로 선택했어요':esc(m.cuisine)+' · '+esc(m.keywords.slice(2,4).join(' · '))}</small></button>`).join('')}</div>${!list.length?'<p class="empty">검색 결과가 없어요. 다른 이름이나 분류로 찾아보세요.</p>':''}${list.length>pickerLimit?'<button type="button" data-action="moreMenus">메뉴 더 보기 ＋</button>':''}`;}
function menuPicker(mode){let ids=mode==='excludeDraft'?draft.excluded:mode==='draftSuggest'?wishlist(draft):[];return `${pickerControls()}<p class="hint">선택한 메뉴: ${ids.filter(Boolean).map(id=>esc(menu(id)?.name||id)).join(', ')||'없음'}</p><div id="menu-results" data-mode="${mode}">${pickerItems(mode)}</div>`;}
function preferences(){return `<div class="form"><button class="back" data-action="dashboard">← 우리 방으로</button><div class="flex"><span class="eyebrow">OUR MENU PICKS</span><span class="pill">${step+1} / 2</span></div><div class="progress"><div style="width:${(step+1)*50}%"></div></div><h1>${step===0?'먹고 싶은 메뉴가 있어?':'피하고 싶은 메뉴가 있어?'}</h1><p class="muted">${step===0?'먹고 싶은 메뉴를 먼저 골라줘. 떠오르지 않으면 넘어가도 괜찮아.':'싫은 메뉴는 여러 개 골라도 돼. 선택한 메뉴는 그룹 추천에서 빠져요.'}</p><div class="box">${step===0?`<h3>먹고 싶은 메뉴 · 여러 개 선택</h3>${menuPicker('draftSuggest')}<p class="hint">선택을 취소하려면 같은 메뉴를 다시 누르세요. 친구들의 제안과 함께 맨 위에 보여요.</p>`:`<h3>이런 음식은 피할래 · 여러 개 선택</h3><div class="choices">${[['spicy','매운 음식'],['soup','국물 음식'],['bones','뼈 있는 음식']].map(([id,name])=>`<button type="button" class="${draft.tags.includes(id)?'on':''}" data-action="tag" data-id="${id}">${draft.tags.includes(id)?'✓ ':''}${name}</button>`).join('')}</div><h3>피하고 싶은 메뉴 고르기</h3>${menuPicker('excludeDraft')}<p class="hint">없으면 선택하지 않고 제출하세요. 먹고 싶은 메뉴와 같은 메뉴를 제외할 수는 없어요.</p>`}<div class="flex">${step?'<button data-action="prev">← 먹고 싶은 메뉴</button>':'<span></span>'}<button class="primary" data-action="next">${step===1?'내 의견 제출하기 ✓':'다음 · 피하고 싶은 메뉴 →'}</button></div></div></div>`}

function review(){let d=room.decision,m=d&&menu(d.menu),agreed=d?room.roster.filter(id=>d.consents[id]==='agree').length:0;return `<button class="back" data-action="home">← 홈</button><div class="eyebrow">ONE LAST CHECK</div><h1>마지막으로, 모두 괜찮아?</h1><p class="muted">${room.roster.length}명의 제출 의견으로 진행해요 · 입장 ${active().length}명 · 결정 마감 ${time(room.decideAt)}</p><div class="grid"><section>${d?`<div class="box"><div class="foodpic" style="border-radius:14px">${m.emoji}</div><div class="sectionhead"><h2>${esc(m.name)}</h2><span class="pill">최종 제안</span></div><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><p class="muted">이 메뉴로 함께 먹을까요? 내 응답: <b>${{agree:'동의했어요',disagree:'어려워요',pending:'아직 응답 전'}[d.consents[room.me]||'pending']}</b></p><div class="flex"><button class="primary" data-action="agree">괜찮아요 ✓</button><button data-action="disagree">이번에는 어려워요</button></div></div>`:'<div class="box empty"><div class="symbol">🍽️</div><h3>방장이 마지막 메뉴를 고르고 있어요</h3><p>최종 메뉴가 제안되면 함께 동의해 주세요.</p></div>'}${host()?`<div class="sectionhead"><h2>${d?'다른 최종안 제안하기':'최종 메뉴 고르기'}</h2></div><div class="choices">${room.recommendations.map(m=>`<button data-action="proposeMenu" data-id="${m.id}">${m.emoji} ${m.name} ↗</button>`).join('')}</div>`:''}</section><aside><div class="box"><h3>함께 확인 중 ${agreed}/${room.roster.length}</h3>${room.roster.map(id=>{let p=room.members.find(p=>p.id===id),s=d?.consents[id];return `<div class="person"><div class="avatar">${esc(p.name[0])}</div>${esc(p.name)}<small>${s==='agree'?'✓ 동의':s==='disagree'?'어려워요':'대기 중'}</small></div>`}).join('')}${host()?`<button class="primary full" data-action="confirm" ${!d||agreed!==room.roster.length?'disabled':''}>이대로 확정하기 ✓</button><p class="hint">모두 동의해야 확정할 수 있어요.</p><button class="full" data-action="reopen">의견 수집 다시 열기</button>`:''}</div></aside></div>`}
function result(){let d=room.decision,m=menu(d.menu);return `<div class="result"><div class="eyebrow">DINNER IS DECIDED</div><h1>오늘 저녁이 정해졌어요!</h1><p class="muted">서로의 취향을 모아 찾은 오늘의 한 끼.</p><div class="box"><div class="symbol">${m.emoji}</div><h1>${esc(m.name)}</h1><p class="muted">${room.roster.length}명 전원 동의 · 입장 ${active().length}명</p></div><button class="primary big" data-action="resultShare">결과 문구 복사하기 ↗</button><p class="hint">아직 주문이 완료된 것은 아니에요.<br>매장에 연락해 주문을 별도로 진행해 주세요.</p></div>`}
function render(){document.querySelector('#local-controls').innerHTML=localControls();if(view==='create'){app.innerHTML=create();return}if(!room){app.innerHTML=home();return}if(room.joinRequired){app.innerHTML=join();return}if(room.status==='confirmed'){app.innerHTML=result();return}if(room.status==='closed'){app.innerHTML='<div class="result"><div class="eyebrow">TABLE CLOSED</div><h1>이번 방은 마감됐어요.</h1><p class="muted">결정 시간 안에 합의하지 못했어요.<br>새 방에서 다시 취향을 모아볼까요?</p><button class="primary" data-action="create">새 방 만들기</button></div>';return}if(view==='preferences'){app.innerHTML=preferences();return}app.innerHTML=room.status==='reviewing'?review():dashboard();}

async function copy(s){try{await navigator.clipboard.writeText(s);toast('복사했어요. 단톡방에 붙여넣어 주세요.')}catch{overlay.innerHTML='<div class="modalbg"><div class="modal"><h2>아래 내용을 복사해 주세요</h2><textarea style="width:100%;height:180px">'+esc(s)+'</textarea><button data-action="dismiss">닫기</button></div></div>'}}
document.addEventListener('click',async e=>{let el=e.target.closest('[data-action]');if(!el||el.disabled)return;let a=el.dataset.action,id=el.dataset.id;if(a==='filterOption'){pickerFilters[el.dataset.key]=el.dataset.value==='전체'?null:el.dataset.value;pickerLimit=24;render()}if(a==='clearFilters'){resetPicker();render()}if(a==='moreMenus'){pickerLimit+=24;render()}if(a==='create')go('create');if(a==='home'){room=null;history.pushState({},'', location.pathname);go('home')}if(a==='dashboard'){resetPicker();go('dashboard')}if(a==='share')addLocalParticipant();if(a==='preferences'){resetPicker();if(room.status!=='collecting')return toast('방장이 의견 수집을 다시 열어야 수정할 수 있어요');draft=structuredClone(room.response||{spice:null,soup:null,staple:null,tags:[],excluded:[]});draft.suggestions=[...wishlist(active().find(p=>p.id===room.me))];delete draft.suggestion;draft.spice='any';draft.soup='any';draft.staple='any';draft.cuisine='any';draft.keywords=[];step=0;go('preferences')}if(a==='choice'){draft[el.dataset.key]=el.dataset.value;render()}if(a==='tag'||a==='excludeDraft'){if(a==='excludeDraft'&&wishlist(draft).includes(id))return;let k=a==='tag'?'tags':'excluded';draft[k]=draft[k].includes(id)?draft[k].filter(x=>x!==id):[...draft[k],id];render()}if(a==='draftSuggest'){let ids=wishlist(draft);draft.suggestions=ids.includes(id)?ids.filter(x=>x!==id):[...ids,id];delete draft.suggestion;draft.excluded=draft.excluded.filter(x=>!draft.suggestions.includes(x));render()}if(a==='prev'){step--;resetPicker();render()}if(a==='next'){if(step===0){step=1;resetPicker();render()}else if(await mutate('preferences',{response:draft,suggestions:wishlist(draft)})){resetPicker();go('dashboard');toast('친구들의 의견과 함께 반영했어요')}}if(a==='suggest')mutate('suggest',{menu:id});if(a==='exclude')mutate('exclude',{menu:id});if(a==='proposeMenu')mutate('propose',{menu:id});if(a==='dismiss')overlay.innerHTML='';if(a==='review'){if(confirm(`입장 ${active().length}명 중 제출한 ${submitted().length}명으로 합의를 진행해요. 미제출자는 포함되지 않아요. 마감할까요?`))mutate('review')}if(a==='reopen')mutate('reopen');if(a==='agree'||a==='disagree')mutate('consent',{decision:room.decision.id,answer:a==='agree'?'agree':'disagree'});if(a==='confirm')mutate('confirm',{decision:room.decision.id});if(a==='resultShare'){let d=room.decision;copy(`[${room.name}]\n메뉴: ${menu(d.menu).name}\n합의: 제출 ${room.roster.length}명 전원 동의 (입장 ${active().length}명)\n주문은 별도 진행`)}});
document.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,b=Object.fromEntries(new FormData(f));let btn=f.querySelector('button[type="submit"],button:last-child');if(btn)btn.disabled=true;try{if(f.id==='createform'){let r=await api('rooms',b);history.pushState({},'',location.pathname+'#room='+r.id);view='dashboard';room=null;await refresh();toast('방을 만들었어요. 같은 기기에서 참여자를 추가할 수 있어요.')}if(f.id==='joinform'){room=await api('rooms/'+new URLSearchParams(location.hash.slice(1)).get('room')+'/join',b);render()}}catch(e){toast(e.message)}finally{if(btn)btn.disabled=false}});
document.addEventListener('input',e=>{if(!e.target.matches('[data-menu-search]'))return;pickerQuery=e.target.value;pickerLimit=24;let results=document.querySelector('#menu-results');if(results){results.innerHTML=pickerItems(results.dataset.mode)}else {let pos=e.target.selectionStart;render();let input=document.querySelector('[data-menu-search]');input?.focus();input?.setSelectionRange(pos,pos)}});

function addLocalParticipant(){overlay.innerHTML='<div class="modalbg"><section class="modal" role="dialog" aria-modal="true" aria-label="참여자 추가"><div class="flex"><h2>함께 고를 친구 추가</h2><button data-action="dismiss">닫기 ×</button></div><form id="local-join"><label class="field" for="local-name">닉네임</label><input id="local-name" name="nickname" required minlength="2" maxlength="12"><p class="hint">이 브라우저 안에 참여자를 추가해요.</p><button class="primary full">추가하기</button></form></section></div>';}
document.addEventListener('click',e=>{if(e.target.closest('[data-action="addLocal"]'))addLocalParticipant()});
document.addEventListener('change',async e=>{if(!e.target.matches('[data-local-person]'))return;const saved=await browserStore.get(room.id);const person=saved.members.find(p=>p.id===e.target.value);if(!person)return;staticSession=person.sid;localStorage.setItem(storagePrefix+'session',staticSession);view='dashboard';room=await api('rooms/'+room.id);resetPicker();render()});
document.addEventListener('submit',async e=>{if(e.target.id!=='local-join')return;e.preventDefault();const previous=staticSession;try{staticSession=uid();room=await api('rooms/'+room.id+'/join',Object.fromEntries(new FormData(e.target)));localStorage.setItem(storagePrefix+'session',staticSession);overlay.innerHTML='';view='dashboard';render()}catch(error){staticSession=previous;toast(error.message)}});

document.querySelector('#newroom').onclick=()=>go('create');async function refresh(){let id=new URLSearchParams(location.hash.slice(1)).get('room');if(!id)return;try{let next=await api('rooms/'+id);let changed=!room||next.version!==room.version||next.joinRequired!==room.joinRequired;room=next;if(changed&&view!=='preferences'&&view!=='create')render()}catch(e){toast(e.message)}}window.onpopstate=()=>{room=null;view='home';refresh().then(render)};try{catalog=await api('menus');await refresh();render()}catch(error){app.innerHTML='<div class="box"><h2>브라우저 저장소를 사용할 수 없어요</h2><p>저장소를 허용하거나 일반 브라우저에서 다시 열어 주세요.</p></div>'}setInterval(()=>{if(!document.hidden)refresh()},3000);
</script></body></html>
